name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  MP_VERSION: v1.29.0

jobs:
  test:
    name: Tests (CPython simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q firmware tools tests store
      - name: App Store catalog is up to date
        run: python tools/build_catalog.py --check
      - name: Smoke test
        run: python tests/smoke_test.py

  firmware:
    name: Firmware (UF2)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
      - name: Cache MicroPython
        uses: actions/cache@v4
        with:
          path: build/micropython
          key: micropython-${{ env.MP_VERSION }}-v1
      - name: Build firmware
        run: ./tools/build_firmware.sh
      - name: Smoke test on the MicroPython unix port
        run: |
          make -C build/micropython/ports/unix submodules
          make -C build/micropython/ports/unix -j"$(nproc)" MICROPY_PY_FFI=0
          python3 tests/smoke_test.py --micropython build/micropython/ports/unix/build-standard/micropython
      - uses: actions/upload-artifact@v4
        with:
          name: PicoOS-pico2w
          path: dist/PicoOS-pico2w.uf2
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PicoOS-pico2w.uf2
          generate_release_notes: true
