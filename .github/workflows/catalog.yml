name: App Store catalog

# Keeps store/catalog.json in sync with store/apps/ so every PicoOS dashboard
# sees new and updated apps as soon as they land on main.
on:
  push:
    branches: [main]
    paths: ["store/apps/**", "tools/build_catalog.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate catalog
        run: python tools/build_catalog.py
      - name: Commit if changed
        run: |
          if git diff --quiet store/catalog.json; then
            echo "catalog unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add store/catalog.json
            git commit -m "store: update catalog.json"
            git push
          fi
