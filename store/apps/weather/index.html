<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather</title><link rel="icon" href="icon.svg">
<style>
:root{--text:#f0f9ff;--muted:#bae6fdaa;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(170deg,#0c4a6e,#1e1b4b);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:30px 16px}
.w{width:min(640px,100%)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.city{font-size:26px;font-weight:650}.sub{color:var(--muted)}
form{display:flex;gap:6px}input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;color:var(--text);font:inherit;width:160px;outline:none}
button{background:rgba(255,255,255,.15);border:0;border-radius:12px;color:var(--text);padding:8px 12px;cursor:pointer;font:inherit}
.now{display:flex;align-items:center;gap:20px;margin:24px 0}
.now .ic{font-size:84px;line-height:1}.now .temp{font-size:76px;font-weight:200;letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px}
.card small{display:block;color:var(--muted);font-size:12px}.card b{font-size:18px;font-weight:600}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.hours .card{min-width:70px;text-align:center}.hours .card div{font-size:24px;margin:4px 0}
.days .row{display:grid;grid-template-columns:110px 34px 1fr 90px;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);position:relative}.bar i{position:absolute;height:100%;border-radius:6px;background:linear-gradient(90deg,#38bdf8,#fbbf24)}
.r{text-align:right;color:var(--muted)}.r b{color:var(--text)}
.msg{text-align:center;padding:60px 0;color:var(--muted)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column}}
</style></head><body>
<div class="w">
  <div class="top"><div><div class="city" id="city">Weather</div><div class="sub" id="desc">Finding your location…</div></div>
  <form id="f"><input id="q" placeholder="Search city"><button>Go</button></form></div>
  <div id="main"><div class="msg">Loading…</div></div>
</div>
<script>
const W={0:["☀️","Clear sky"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["🌨️","Snow grains"],80:["🌦️","Showers"],81:["🌧️","Showers"],82:["⛈️","Violent showers"],85:["🌨️","Snow showers"],86:["❄️","Snow showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm, hail"],99:["⛈️","Thunderstorm, hail"]};
const w=c=>W[c]||["🌡️","Unknown"];const $=s=>document.querySelector(s);
async function geocode(name){const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=${encodeURIComponent(name)}`).then(r=>r.json());if(!r.results)throw new Error(`“${name}” not found`);const g=r.results[0];return{name:g.name,country:g.country,lat:g.latitude,lon:g.longitude}}
async function show(loc){$("#city").textContent=loc.name;$("#desc").textContent=loc.country||"";localStorage.wxCity=loc.name;
const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,surface_pressure&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=7`;
const d=await fetch(u).then(r=>r.json());const c=d.current;const [ic,txt]=w(c.weather_code);$("#desc").textContent=`${txt} · ${loc.country||""}`;
const nowIdx=d.hourly.time.findIndex(t=>t>=c.time.slice(0,13));const hrs=d.hourly.time.slice(nowIdx,nowIdx+24).map((t,i)=>`<div class="card"><small>${t.slice(11,16)}</small><div>${w(d.hourly.weather_code[nowIdx+i])[0]}</div><b>${Math.round(d.hourly.temperature_2m[nowIdx+i])}°</b></div>`).join("");
const lo=Math.min(...d.daily.temperature_2m_min),hi=Math.max(...d.daily.temperature_2m_max);
const days=d.daily.time.map((t,i)=>{const a=d.daily.temperature_2m_min[i],b=d.daily.temperature_2m_max[i];return`<div class="row"><span>${i?new Date(t+"T12:00").toLocaleDateString("en",{weekday:"long"}):"Today"}</span><span>${w(d.daily.weather_code[i])[0]}</span><div class="bar"><i style="left:${(a-lo)/(hi-lo||1)*100}%;width:${(b-a)/(hi-lo||1)*100}%"></i></div><span class="r">${Math.round(a)}° / <b>${Math.round(b)}°</b></span></div>`}).join("");
$("#main").innerHTML=`<div class="now"><div class="ic">${ic}</div><div><div class="temp">${Math.round(c.temperature_2m)}°</div><div class="sub">Feels like ${Math.round(c.apparent_temperature)}° · H ${Math.round(d.daily.temperature_2m_max[0])}° L ${Math.round(d.daily.temperature_2m_min[0])}°</div></div></div>
<div class="grid"><div class="card"><small>Humidity</small><b>${c.relative_humidity_2m}%</b></div><div class="card"><small>Wind</small><b>${Math.round(c.wind_speed_10m)} km/h</b></div><div class="card"><small>Rain chance</small><b>${d.daily.precipitation_probability_max[0]??0}%</b></div><div class="card"><small>Sunset</small><b>${d.daily.sunset[0].slice(11)}</b></div></div>
<div class="hours">${hrs}</div><div class="days">${days}</div>`}
async function start(){try{let name=localStorage.wxCity;if(!name){try{const t=await fetch("_picoos/time").then(r=>r.json());name=t.city}catch{}}
if(!name){try{const j=await fetch("https://ipapi.co/json/").then(r=>r.json());name=j.city}catch{}}
await show(await geocode(name||"London"))}catch(e){$("#main").innerHTML=`<div class="msg">${e.message}<br>Weather needs internet access in your browser.</div>`}}
$("#f").onsubmit=async e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;try{await show(await geocode(q));$("#q").value=""}catch(er){$("#desc").textContent=er.message}};start();
</script></body></html>
