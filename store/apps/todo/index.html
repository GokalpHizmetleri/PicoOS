<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasks</title><link rel="icon" href="icon.svg">
<style>
:root{--line:#24324a;--text:#ecfdf5;--muted:#94a3b8;--accent:#10b981;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#0b3b4a,#08121f 60%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:40px 16px}
.wrap{width:min(560px,100%)}h1{font-size:30px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 22px}
form{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--accent)}
select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;padding:0 10px}
button.add{background:var(--accent);border:0;border-radius:14px;padding:0 18px;color:#03241a;font:inherit;font-weight:700;cursor:pointer}
.filters{display:flex;gap:6px;margin-bottom:12px}.filters button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}.filters button.on{background:var(--text);color:#08121f;border-color:var(--text)}
ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px}
li.done span{text-decoration:line-through;color:var(--muted)}
li span{flex:1;word-break:break-word}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);background:none;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:#03241a;font-weight:900}
li.done .chk{background:var(--accent);border-color:var(--accent)}
.pri{width:8px;height:8px;border-radius:50%;flex:none}.p3{background:#f87171}.p2{background:#fbbf24}.p1{background:#64748b}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;opacity:.5}.x:hover{opacity:1;color:#f87171}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:14px}.foot button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit}
.empty{text-align:center;color:var(--muted);padding:30px}
</style></head><body>
<div class="wrap">
  <h1>✅ Tasks</h1><p class="sub" id="sub">Stored on your Pico</p>
  <form id="f"><input id="t" placeholder="What needs to be done?" maxlength="140" autocomplete="off"><select id="p" title="Priority"><option value="1">Low</option><option value="2" selected>Normal</option><option value="3">High</option></select><button class="add">Add</button></form>
  <div class="filters" id="filters"><button data-f="all" class="on">All</button><button data-f="open">Open</button><button data-f="done">Done</button></div>
  <ul id="list"></ul>
  <div class="foot"><span id="count"></span><button id="clear">Clear completed</button></div>
</div>
<script>
const API="_picoos/data/tasks";let tasks=[],filter="all";const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){try{const r=await fetch(API);tasks=r.ok?await r.json():[]}catch{tasks=JSON.parse(localStorage.tasks||"[]");$("#sub").textContent="Offline – stored in this browser"}render()}
async function save(){localStorage.tasks=JSON.stringify(tasks);try{await fetch(API,{method:"PUT",body:JSON.stringify(tasks)})}catch{}}
function render(){const shown=tasks.filter(t=>filter=="all"||(filter=="done"?t.done:!t.done)).sort((a,b)=>a.done-b.done||b.p-a.p||a.id-b.id);
$("#list").innerHTML=shown.map(t=>`<li class="${t.done?"done":""}" data-id="${t.id}"><button class="chk" data-a="toggle">${t.done?"✓":""}</button><i class="pri p${t.p}"></i><span>${esc(t.text)}</span><button class="x" data-a="del" title="Delete">×</button></li>`).join("")||`<div class="empty">${filter=="done"?"Nothing completed yet":"All clear! Add a task above."}</div>`;
const open=tasks.filter(t=>!t.done).length;$("#count").textContent=`${open} open · ${tasks.length-open} done`}
$("#f").onsubmit=e=>{e.preventDefault();const v=$("#t").value.trim();if(!v)return;tasks.push({id:Date.now(),text:v,p:+$("#p").value,done:false});$("#t").value="";render();save()};
$("#list").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const id=+b.closest("li").dataset.id;if(b.dataset.a=="del")tasks=tasks.filter(t=>t.id!==id);else{const t=tasks.find(t=>t.id===id);t.done=!t.done}render();save()};
$("#filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x===b));render()};
$("#clear").onclick=()=>{tasks=tasks.filter(t=>!t.done);render();save()};load();
</script></body></html>
